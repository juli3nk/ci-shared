name: go-lint

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use'
        required: false
        type: string
        default: "1.26.7"
      check_all:
        description: 'Check all Go files instead of only changed ones'
        required: false
        type: boolean
        default: false
      files_go:
        description: 'JSON-encoded list of Go files changed'
        required: false
        type: string
        default: "[]"

env:
  DAGGER_NO_NAG: "1"

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1

      - name: Lint Go
        run: |
          if [[ '${{ inputs.check_all }}' == 'true' ]]; then
            dagger call go --version=${{ inputs.go_version }} lint
          elif [[ '${{ inputs.files_go }}' =~ ^\[.+\]$ ]]; then
            dagger call go --version=${{ inputs.go_version }} lint --paths-json='${{ inputs.files_go }}'
          fi

      - name: Check Go formatting
        run: |
          if [[ '${{ inputs.check_all }}' == 'true' ]]; then
            dagger call go --version=${{ inputs.go_version }} fmt
          elif [[ '${{ inputs.files_go }}' =~ ^\[.+\]$ ]]; then
            dagger call go --version=${{ inputs.go_version }} fmt --paths-json='${{ inputs.files_go }}'
          fi
