name: go-build

on:
  workflow_call:

env:
  DAGGER_NO_NAG: "1"

jobs:
  go:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: dagger/dagger-for-github@v8.4.1
        with:
          call: goreleaser build --snapshot export --path=./dist
