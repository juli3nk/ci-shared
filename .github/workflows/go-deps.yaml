name: deps

on:
  workflow_call:
    inputs:
      go_version:
        description: 'Go version to use'
        required: false
        type: string
        default: "1.26.7"
      check_licenses:
        description: 'Enable Go Licenses verification'
        required: false
        type: boolean
        default: true

env:
  DAGGER_NO_NAG: "1"

jobs:
  go:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Go modules
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: check
          args: go:modcheck

      - name: Scan vulnerabilities
        uses: dagger/dagger-for-github@v8.4.1
        with:
          call: go --version=${{ inputs.go_version }} vuln

      - name: Check licenses
        if: ${{ inputs.check_licenses }}
        uses: dagger/dagger-for-github@v8.4.1
        with:
          call: go --version=${{ inputs.go_version }} licenses
